[project]
name = "aiplatform"
version = "0.1.0"
description = "Local AI platform: memory, controlled tools and permissions around a local Qwen3.6 model"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "selectolax>=0.3.21",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiplatform"]

[tool.ruff]
line-length = 130
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S101", "RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["aiplatform"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "selectolax.*", "prometheus_client.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs the test database", "live: needs the running stack and model (run explicitly)"]
addopts = "-m 'not live' -p no:cacheprovider"
